[package]
name = "workbench-voice"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/transcript.rs"

[[bin]]
name = "workbench-voice"
path = "src/main.rs"
required-features = ["native"]

[features]
native = ["dep:sherpa-onnx-sys", "dep:base64"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.22.1", optional = true }
sherpa-onnx-sys = { version = "=1.13.7", default-features = false, features = ["shared"], optional = true }

[dev-dependencies]
hound = "3.5.1"
