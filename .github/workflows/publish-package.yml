name: publish npm package
run-name: publish @inthedark/wb@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: exact committed package version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: install current npm cli
        run: npm install --global npm@latest
      - name: publish
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node scripts/publish-package.mjs --publish --version "$EXPECTED_VERSION"
