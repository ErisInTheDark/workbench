packages:
  - app
  - daemon
  - package
  - shared

runtime: false

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  better-sqlite3: true
  bufferutil: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  sharp: true
minimumReleaseAgeExclude:
  - "@opencode/*"
  - "@github/copilot"
  - "@github/copilot-*"
  - "@anthropic-ai/*"
  - "@openai/codex"
trustPolicyExclude:
  - "@smithy/core@3.33.0"
  - "pino@9.14.0"
  - "semver@6.3.1"
overrides:
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  postcss@<8.5.10: '>=8.5.10'
patchedDependencies:
  tsx@4.23.13: patches/tsx@4.23.13.patch
