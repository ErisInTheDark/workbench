packages:
  - app
  - daemon
  - package
  - runner
  - shared

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  better-sqlite3: true
  bufferutil: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  sharp: true
minimumReleaseAgeExclude:
  - "@opencode-ai/*"
  - "@github/copilot"
  - "@github/copilot-sdk"
  - "@github/copilot-linux-x64"
  - "@github/copilot-win32-x64"
  - "@github/copilot-darwin-x64"
  - "@github/copilot-linuxmusl-x64"
  - "@github/copilot-win32-arm64"
  - "@github/copilot-linux-arm64"
  - "@github/copilot-darwin-arm64"
  - "@github/copilot-linuxmusl-arm64"
trustPolicyExclude:
  - "@smithy/core@3.33.0"
  - "pino@9.14.0"
  - "semver@6.3.1"
overrides:
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  postcss@<8.5.10: '>=8.5.10'
patchedDependencies:
  tsx@4.21.0: patches/tsx@4.21.0.patch
